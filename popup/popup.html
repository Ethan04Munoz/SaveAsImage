<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Save to Image</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container mt-5">
        <h1 class="card-title text-center mb-4">
            <img src="../icons/new-icon-noarrow.png" alt="Icono"> Save to Image
        </h1>
        <div class="card shadow-sm">
            <div class="card-body">

                <div class="feature-section mb-3">
                    <p>Tipo de archivo predeterminado</p>
                    <select id="fileTypeSelect" class="form-select">
                        <option value="png">PNG</option>
                        <option value="jpg">JPG</option>
                        <option value="webp">WEBP</option>
                    </select>
                </div>

                <div class="feature-section mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="askWhereToSave">
                        <label class="form-check-label" for="askWhereToSave">
                            Preguntar dónde guardar
                        </label>
                    </div>
                    <small class="form-text">
                        Desactivado: se guarda directamente en tu carpeta de descargas.
                    </small>
                </div>

                <div class="d-flex">
                    <a href="../pages/about.html" class="btn btn-outline-primary btn-100" target="_blank" rel="noopener noreferrer">Acerca de Save to Image</a>
                </div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
