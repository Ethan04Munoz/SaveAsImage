<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Save to Image</title>
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <main class="popup">
        <header class="masthead">
            <img class="masthead__icon" src="../icons/new-icon-noarrow.png" alt="" width="38" height="38">
            <div class="masthead__text">
                <p class="kicker" id="versionKicker">Firefox</p>
                <h1 class="masthead__title">Save to Image</h1>
            </div>
        </header>

        <form id="configForm">
            <fieldset class="format">
                <legend class="kicker format__legend">Formato de salida</legend>

                <label class="format__option">
                    <input class="format__input" type="radio" name="fileType" value="png">
                    <span class="format__surface">
                        <span class="format__index">01</span>
                        <span class="format__body">
                            <span class="format__code">PNG</span>
                            <span class="format__note">Sin pérdida, conserva la transparencia</span>
                        </span>
                    </span>
                </label>

                <label class="format__option">
                    <input class="format__input" type="radio" name="fileType" value="jpg">
                    <span class="format__surface">
                        <span class="format__index">02</span>
                        <span class="format__body">
                            <span class="format__code">JPG</span>
                            <span class="format__note">Fotos, archivos más ligeros</span>
                        </span>
                    </span>
                </label>

                <label class="format__option">
                    <input class="format__input" type="radio" name="fileType" value="webp">
                    <span class="format__surface">
                        <span class="format__index">03</span>
                        <span class="format__body">
                            <span class="format__code">WEBP</span>
                            <span class="format__note">Formato web, buena compresión</span>
                        </span>
                    </span>
                </label>
            </fieldset>

            <div class="saving">
                <p class="kicker saving__kicker">Al guardar</p>

                <label class="switch" for="askWhereToSave">
                    <input type="checkbox" id="askWhereToSave" class="switch__input">
                    <span class="switch__track" aria-hidden="true">
                        <span class="switch__knob"></span>
                    </span>
                    <span class="switch__label">Preguntar dónde guardar</span>
                </label>

                <p class="hint" id="saveHint">
                    Desactivado se guarda directo en tu carpeta de descargas.
                </p>
            </div>
        </form>

        <footer class="footer">
            <a class="about-button" href="../pages/about.html" target="_blank" rel="noopener noreferrer">
                <span>Acerca de Save to Image</span>
                <span class="about-button__arrow" aria-hidden="true">↗</span>
            </a>
        </footer>
    </main>

    <script src="popup.js"></script>
</body>

</html>
